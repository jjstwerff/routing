<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>routing — standalone store app</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font: 13px system-ui, sans-serif; }
  #map { display: block; width: 100vw; height: 100vh; cursor: crosshair; background: #f2efe9; }
  #hud { position: fixed; left: 8px; top: 8px; max-width: 90vw; background: rgba(255,255,255,.88);
         padding: 4px 8px; border-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.2); color: #333; }
  /* Activity x sub-mode (DESIGN §6). Top-RIGHT: the HUD owns the top-left and the sketch owns the
     bottom, and a selector that covers the map you are drawing on is a selector in the way. */
  #activity-bar { position: fixed; right: 8px; top: 8px; display: flex; gap: 6px; z-index: 2; }
  /* PLAN-RESTORE R4 — search our OWN name store; nothing leaves the machine. Top-left, opposite the
     activity bar, because it is the other thing you reach for before drawing anything. */
  #search-bar { position: fixed; left: 8px; top: 8px; z-index: 3; width: min(300px, 46vw); }
  #search-input { width: 100%; box-sizing: border-box; background: rgba(255,255,255,.94); color: #333;
                  border: 1px solid #cfcac3; border-radius: 4px; padding: 6px 8px;
                  font: 13px system-ui, sans-serif; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  #search-results { margin: 3px 0 0; padding: 0; list-style: none; background: rgba(255,255,255,.97);
                    border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.25); overflow: hidden; }
  #search-results.hidden { display: none; }
  #search-results li { padding: 6px 8px; font: 13px system-ui, sans-serif; color: #333; cursor: pointer;
                       border-bottom: 1px solid #efece8; }
  #search-results li:last-child { border-bottom: 0; }
  #search-results li:hover, #search-results li[aria-selected="true"] { background: #eef4ff; }
  #search-results li .kind { color: #8a8078; font-size: 11px; margin-left: 6px; }
  #activity-bar select { background: rgba(255,255,255,.92); color: #333; border: 1px solid #cfcac3;
                         border-radius: 4px; padding: 4px 6px; font: 13px system-ui, sans-serif;
                         box-shadow: 0 1px 3px rgba(0,0,0,.2); cursor: pointer; }
  /* Touch has no double-click, so a selected point gets an explicit Delete (DESIGN.md §1). */
  #rough-delete { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
                  background: #f04438; color: #fff; border: 0; border-radius: 6px; padding: 10px 18px;
                  font: 600 14px system-ui, sans-serif; box-shadow: 0 2px 8px rgba(0,0,0,.3); cursor: pointer; }
  #rough-delete.hidden { display: none; }
  /* Deliberately plain and out of the way: it is a tool, not a feature, and it must never compete with
     the map for attention on the screen a visitor came for. */
  #diag-btn { position: fixed; right: 8px; bottom: 8px; z-index: 20;
              background: #334155; color: #e2e8f0; border: 0; border-radius: 6px; padding: 6px 10px;
              font: 600 12px system-ui, sans-serif; opacity: .85; cursor: pointer; }
  #diag-btn.hidden { display: none; }
  /* A bulk delete is the one risky edit, so the phone gets a brief one-tap way back (DESIGN.md §1);
     single moves and inserts are self-correcting and get no chrome. */
  #undo-snackbar { position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%);
                   background: rgba(32,32,32,.94); color: #fff; border-radius: 6px; padding: 8px 12px;
                   font: 14px system-ui, sans-serif; box-shadow: 0 2px 8px rgba(0,0,0,.4);
                   display: flex; align-items: center; gap: 6px; }
  #undo-snackbar.hidden { display: none; }
  #undo-snackbar button { background: none; border: 0; color: #7fb0ff; font: 600 14px system-ui, sans-serif;
                          cursor: pointer; padding: 2px 4px; }
  /* PLAN-LAYERS §5b — the route bar: how far this route is, and a way to take it with you. Bottom-LEFT:
     the HUD owns the top-left, the delete button and the snackbar own the bottom-centre, and a route you
     just drew is the one thing you look for after drawing it. Hidden until there IS a route. */
  #route-bar { position: fixed; left: 8px; bottom: 16px; display: flex; align-items: center; gap: 8px;
               background: rgba(255,255,255,.94); border-radius: 6px; padding: 6px 8px 6px 12px;
               box-shadow: 0 1px 3px rgba(0,0,0,.25); font: 14px system-ui, sans-serif; color: #333; }
  #route-bar.hidden { display: none; }
  #route-dist { font-weight: 600; font-variant-numeric: tabular-nums; }
  #route-gpx { background: #2b6cff; color: #fff; border: 0; border-radius: 4px; padding: 5px 10px;
               font: 600 13px system-ui, sans-serif; cursor: pointer; }
  /* Shift+drag rubber band (desktop). Transient chrome, so it is a DOM element rather than a canvas draw. */
  #select-box { position: fixed; border: 1px solid #2b6cff; background: rgba(43,108,255,.12);
                pointer-events: none; }
  #select-box.hidden { display: none; }
</style>
<canvas id="map"></canvas>
<div id="search-bar">
  <input id="search-input" type="search" autocomplete="off" spellcheck="false"
         placeholder="Search a street or place" aria-label="Search a street or place">
  <ul id="search-results" class="hidden" role="listbox"></ul>
</div>
<div id="activity-bar">
  <select id="activity" aria-label="Activity"></select>
  <select id="submode" aria-label="Sub-mode"></select>
</div>
<div id="hud">loading…</div>
<button id="rough-delete" class="hidden">Delete point</button>
<div id="route-bar" class="hidden"><span id="route-dist"></span><button id="route-gpx" type="button">GPX</button></div>
<div id="undo-snackbar" class="hidden"><span id="undo-snack-label"></span><button id="undo-snack-btn" type="button">Undo</button></div>
<div id="select-box" class="hidden"></div>
<!-- The diagnostics control. HIDDEN unless the app is asked for it (`#…&debug`, or a local origin), so
     the ordinary map keeps its screen — a debug button nobody asked for is clutter on a phone. -->
<button id="diag-btn" class="hidden" type="button" title="Collect what the app has been doing">Debug</button>
<script type="module" src="./store-app.mjs"></script>
