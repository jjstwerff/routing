# Coverage manifest — PLAN-SCALE §7 R0. THE source of truth for what the app covers.
#
# Everything downstream is a function of this file: `tools/build_index.sh` reads it, opens each block to
# learn its ACTUAL extent (never the intent stated here), and writes the top index the app resolves
# against. A region enters coverage by being added here and nowhere else.
#
# Deliberately NOT here: bounding boxes. A block's extent is a fact about the data — osmium clips, a
# generator drops what it cannot classify — so it is derived, not declared. A declared bbox that outran
# its data would be a hole in the map that the index insisted was covered.
#
# read_mode — how the client reads the block (PLAN-SCALE C1b):
#   whole  download once, keep it (right while a block is a few pages wide)
#   paged  store_load_keys over HTTP Range, only the cells a command touches (right at C2 scale)

# The block that ships WITH the app — small, committed, same-origin, and therefore the only one a browser
# can read today (see the CORS note below). It is what every local gate runs against.
# ⚠ THE CLIP BBOX IS PART OF THE BLOCK, so it is written down here. It was not, and rebuilding the base
# map on 2026-07-31 then had no way to reproduce the block it was replacing: the first box tried produced
# 1734 tiles against 1089, a 2.3x bigger download for every visitor. Recovering it took four builds,
# steering on `store_extent`'s four bounds until all of them matched the shipped store exactly.
#
#   tools/build-blocks.sh enschede europe/netherlands 6.75374,52.16,6.9958,52.33      # ROADS
#   tools/build-base.sh   enschede europe/netherlands 6.82558,52.1707,6.9958,52.3230  # BASE
#
# ⚠ The two boxes DIFFER, and that is not an oversight — they were cut separately when the block was first
# made, and each was recovered by steering on its own `store_extent` until all four bounds matched the
# shipped block exactly. Using one box for both would silently re-cut the other layer.
#
# The box looks arbitrary because it IS: `osmium extract` keeps whole ways, so features overhang it by up
# to ~0.09°, and the box is whatever makes the OVERHANG land on the intended extent. Do not "tidy" it to
# round numbers — that changes the block. Expect tile/feature counts to drift with the OSM snapshot (the
# 2026-07-31 rebuild came out at 1093 tiles / 208536 features against 1089 / 204982 two days earlier);
# the four EXTENT bounds are the thing that must match.
[[region]]
id        = "enschede"
name      = "Enschede / south Overijssel"
zoom_min  = 11
roads     = "stores/enschede.roads.store"
base      = "stores/enschede.layout.store"
names     = "stores/enschede.names.store"
read_mode = "whole"

# ⚠ ROAD BLOCKS MUST NOT OVERLAP. The Enschede roads block was removed here when the Netherlands block
# landed, because NL covers the same ground: with both listed, a sketch whose padded bbox escapes the small
# block names BOTH, the same roads are read twice and fed to `build_graph` twice. It survived only because
# the graph dedups nodes by coordinate — 7138 ways became 9438 for an identical route. A duplicated way is
# not reliably a slower match, it is a different one, so the fix is in the DATA: one block per area, cut on
# cell boundaries (which is what a per-region generation produces anyway).
#
# The Enschede stores are still in the repo and still drive every native gate; they are simply no longer
# a coverage region now that a real country block exists.

# The Netherlands, as TWO regions cut at 5.40°E (tools/split_base.loft / split_block.loft).
#
# Why two: the base map is 3.2 GB for the country and a GitHub release asset stops at 2 GB, so a country
# cannot ship as one file. Regions are §7 R0's unit anyway and are cut on CELL boundaries, so these halves
# are what a per-region generation would have produced directly — and S8's gate proves a route crossing
# the seam is the route the whole region gives.
#
# HOSTING IS PER STORE, and the Netherlands is why (PLAN-SCALE N3, 2026-08-01). Measured:
#
#   NL roads, both halves    497.2 MB   +  26.6 MB site  =  523.8 MB   → fits the ~1 GB Pages cap
#   NL base map, both halves 2874.0 MB                                 → 3x over it
#
# So the ROADS ship beside the app, same-origin and site-relative — which is what makes routing live for
# the whole country — and only the BASE MAP keeps a `base_url_base` pointing at the release. A site index
# then names no base for these regions at all, and the app renders roads and a route on a plain
# background outside Enschede (store-app.mjs handles `base: null`; it is a product, not a fallback).
#
# ⚠ Release assets serve Range but send NO CORS header (measured 2026-07-30), so a BROWSER on another
# origin cannot read the base map there — it serves downloads, the native server and offline use. That is
# also why the base cannot simply be named here: the page would resolve a URL it can never fetch.
#
# ⚠ This does NOT mean the browser needs a third-party CORS host. GitHub Pages serves real byte ranges
# (re-measured against the live site 2026-07-30 — the earlier "Pages answers 200 with the whole file"
# claim was measured against `python3 -m http.server` and is wrong). What stopped NL shipping on Pages
# was SIZE, and splitting the two stores is what gets under it. PLAN-SCALE D2.
#
# ⚠ The blocks are NOT committed: nl-east.roads.store is 263.9 MB and GitHub hard-rejects any file over
# 100 MB. The Pages job downloads them from the release into blocks/ before the site build.

# PLAN-SCALE §6f F3/F4 — the Netherlands as FOUR regions, cut at 4.70 / 5.40 / 5.90°E.
#
# Four, not two, and the count came out of arithmetic rather than taste: each base block has to fit a
# Pages site (~1 GB), and each carries a 0.10° MARGIN of its neighbours so that a viewport ON a cut is
# answered whole by ONE region. Three regions cannot hold that margin under the cap — the eastern one
# lands at 957 MB. The margin is what stops a seam ever being drawn; without it one region answers a
# straddling viewport with 54% of it.
#
# ⚠ ROADS ARE CUT WITHOUT THE MARGIN, so a region's two stores do NOT describe the same ground. The
# client stitches road blocks across a seam (S8) and a duplicated way is a different match, not a slower
# one — `block_overlap_gate` enforces that they stay disjoint. The base map is the opposite case.
#
# ⚠ AND THE BASE MAP IS HOSTED ELSEWHERE. 2.75 GB does not fit beside the app, so each block gets its own
# Pages data repo (`base_url_base`) — free, and measured to send `access-control-allow-origin: *` with a
# real 206, which a GitHub release does not. The roads and names ship with the site: 565 MB of a 950 MB
# budget.

# PLAN-SCALE §6i O1 — THE OVERVIEW: the map the app opens the country on.
#
# Not a region. It is the whole Netherlands generalised to what a low zoom can SHOW — every feature the
# renderer draws at or below z10, decimated to one pixel at z10, plus the motorway/trunk/primary spine
# lifted out of the roads store and merged into runs. 17 290 495 features become 132 094, and 159 Mcoords
# become 774 431: **19.6 MB, downloaded WHOLE** (tools/build_overview.loft).
#
# Why whole and not paged: a country-wide viewport names 454 867 cell keys, and §6i measured a key at ~3
# pages (~200 kB) whether or not it holds anything. The whole file is cheaper than six keys. Paging is
# right for a city and wrong for a country, which is the same measurement read from both ends.
#
# ⚠ IT HAS NO ROADS STORE, AND THAT IS THE POINT. It is a picture, never a routing input — a route must
# never be matched against decimated geometry. `chooseBlocks` skips it for `roads` automatically (it has
# no store of that kind), so routing at any zoom still reads the detailed region blocks.
#
# ⚠ THE ZOOM BAND IS LOAD-BEARING, not a nicety. Without it a country-wide box selects the overview AND
# the four regions: the app would ask 454 867 keys of each detailed block, and a `whole` block and a
# `paged` one cannot share one working set anyway. `zoom_max`/`zoom_min` make the two sets EXCLUSIVE —
# below the handover the map is the overview alone, above it the regions alone.
[[region]]
id        = "nl-overview"
name      = "Netherlands — overview"
base      = "stores/nl-overview.base.store"
names     = "stores/nl.names.store"
read_mode = "whole"
zoom_max  = 11

[[region]]
id        = "nl-west"
name      = "Netherlands (west of 4.70°E)"
zoom_min  = 11
roads     = "stores/nl-west.roads.store"
base      = "stores/nl-west.base.store"
names     = "stores/nl.names.store"
read_mode = "paged"
base_url_base = "https://jjstwerff.github.io/routing-data-nl-west"
base_cors     = true

