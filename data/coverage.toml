# Coverage manifest — PLAN-SCALE §7 R0. THE source of truth for what the app covers.
#
# Everything downstream is a function of this file: `tools/build_index.sh` reads it, opens each block to
# learn its ACTUAL extent (never the intent stated here), and writes the top index the app resolves
# against. A region enters coverage by being added here and nowhere else.
#
# Deliberately NOT here: bounding boxes. A block's extent is a fact about the data — osmium clips, a
# generator drops what it cannot classify — so it is derived, not declared. A declared bbox that outran
# its data would be a hole in the map that the index insisted was covered.
#
# read_mode — how the client reads the block (PLAN-SCALE C1b):
#   whole  download once, keep it (right while a block is a few pages wide)
#   paged  store_load_keys over HTTP Range, only the cells a command touches (right at C2 scale)

# The block that ships WITH the app — small, committed, same-origin, and therefore the only one a browser
# can read today (see the CORS note below). It is what every local gate runs against.
# ⚠ THE CLIP BBOX IS PART OF THE BLOCK, so it is written down here. It was not, and rebuilding the base
# map on 2026-07-31 then had no way to reproduce the block it was replacing: the first box tried produced
# 1734 tiles against 1089, a 2.3x bigger download for every visitor. Recovering it took four builds,
# steering on `store_extent`'s four bounds until all of them matched the shipped store exactly.
#
#   tools/build-blocks.sh enschede europe/netherlands 6.75374,52.16,6.9958,52.33      # ROADS
#   tools/build-base.sh   enschede europe/netherlands 6.82558,52.1707,6.9958,52.3230  # BASE
#
# ⚠ The two boxes DIFFER, and that is not an oversight — they were cut separately when the block was first
# made, and each was recovered by steering on its own `store_extent` until all four bounds matched the
# shipped block exactly. Using one box for both would silently re-cut the other layer.
#
# The box looks arbitrary because it IS: `osmium extract` keeps whole ways, so features overhang it by up
# to ~0.09°, and the box is whatever makes the OVERHANG land on the intended extent. Do not "tidy" it to
# round numbers — that changes the block. Expect tile/feature counts to drift with the OSM snapshot (the
# 2026-07-31 rebuild came out at 1093 tiles / 208536 features against 1089 / 204982 two days earlier);
# the four EXTENT bounds are the thing that must match.
# ⚠ ENSCHEDE IS NO LONGER A COVERAGE REGION — it is a GATE FIXTURE (`data/coverage-fixture.toml`).
#
# It was the block that shipped with the app before the country existed, and once NL landed it did not
# just become redundant, it became HARMFUL: `chooseBlocks` prefers the smallest block containing a box, so
# the city block shadowed `nl-east` over its whole roads extent (6.74–7.01°E) while its BASE was clipped
# tighter, to 6.761–7.027 / 52.161–52.329. In the gap between the two the app drew roads on an empty
# background. Measured on the live site: **Hengelo 3 802 buildings against the 28 324 the country block
# gives one town away**, and reported as "it tries the Enschede block and draws nothing, even inside NL".
#
# The stores stay in the repo and still drive every offline gate — they are just not something a visitor
# can be routed to any more. `browser/build-site.mjs` merges the fixture index under SITE_LOCAL_ONLY.

# ⚠ ROAD BLOCKS MUST NOT OVERLAP. The Enschede roads block was removed here when the Netherlands block
# landed, because NL covers the same ground: with both listed, a sketch whose padded bbox escapes the small
# block names BOTH, the same roads are read twice and fed to `build_graph` twice. It survived only because
# the graph dedups nodes by coordinate — 7138 ways became 9438 for an identical route. A duplicated way is
# not reliably a slower match, it is a different one, so the fix is in the DATA: one block per area, cut on
# cell boundaries (which is what a per-region generation produces anyway).
#
# The Enschede stores are still in the repo and still drive every native gate; they are simply no longer
# a coverage region now that a real country block exists.

# The Netherlands, as TWO regions cut at 5.40°E (tools/split_base.loft / split_block.loft).
#
# Why two: the base map is 3.2 GB for the country and a GitHub release asset stops at 2 GB, so a country
# cannot ship as one file. Regions are §7 R0's unit anyway and are cut on CELL boundaries, so these halves
# are what a per-region generation would have produced directly — and S8's gate proves a route crossing
# the seam is the route the whole region gives.
#
# HOSTING IS PER STORE, and the Netherlands is why (PLAN-SCALE N3, 2026-08-01). Measured:
#
#   NL roads, both halves    497.2 MB   +  26.6 MB site  =  523.8 MB   → fits the ~1 GB Pages cap
#   NL base map, both halves 2874.0 MB                                 → 3x over it
#
# So the ROADS ship beside the app, same-origin and site-relative — which is what makes routing live for
# the whole country — and only the BASE MAP keeps a `base_url_base` pointing at the release. A site index
# then names no base for these regions at all, and the app renders roads and a route on a plain
# background outside Enschede (store-app.mjs handles `base: null`; it is a product, not a fallback).
#
# ⚠ Release assets serve Range but send NO CORS header (measured 2026-07-30), so a BROWSER on another
# origin cannot read the base map there — it serves downloads, the native server and offline use. That is
# also why the base cannot simply be named here: the page would resolve a URL it can never fetch.
#
# ⚠ This does NOT mean the browser needs a third-party CORS host. GitHub Pages serves real byte ranges
# (re-measured against the live site 2026-07-30 — the earlier "Pages answers 200 with the whole file"
# claim was measured against `python3 -m http.server` and is wrong). What stopped NL shipping on Pages
# was SIZE, and splitting the two stores is what gets under it. PLAN-SCALE D2.
#
# ⚠ The blocks are NOT committed: nl-east.roads.store is 263.9 MB and GitHub hard-rejects any file over
# 100 MB. The Pages job downloads them from the release into blocks/ before the site build.

# PLAN-SCALE §6f F3/F4 — the Netherlands as FOUR regions, cut at 4.70 / 5.40 / 5.90°E.
#
# Four, not two, and the count came out of arithmetic rather than taste: each base block has to fit a
# Pages site (~1 GB), and each carries a 0.10° MARGIN of its neighbours so that a viewport ON a cut is
# answered whole by ONE region. Three regions cannot hold that margin under the cap — the eastern one
# lands at 957 MB. The margin is what stops a seam ever being drawn; without it one region answers a
# straddling viewport with 54% of it.
#
# ⚠ ROADS ARE CUT WITHOUT THE MARGIN, so a region's two stores do NOT describe the same ground. The
# client stitches road blocks across a seam (S8) and a duplicated way is a different match, not a slower
# one — `block_overlap_gate` enforces that they stay disjoint. The base map is the opposite case.
#
# ⚠ AND THE BASE MAP IS HOSTED ELSEWHERE. 2.75 GB does not fit beside the app, so each block gets its own
# Pages data repo (`base_url_base`) — free, and measured to send `access-control-allow-origin: *` with a
# real 206, which a GitHub release does not. The roads and names ship with the site: 565 MB of a 950 MB
# budget.

# PLAN-SCALE §6i O1 — THE OVERVIEW: the map the app opens the country on.
#
# Not a region. It is the whole Netherlands generalised to what a low zoom can SHOW — every feature the
# renderer draws at or below z10, decimated to one pixel at z10, plus the motorway/trunk/primary spine
# lifted out of the roads store and merged into runs. 17 290 495 features become 132 094, and 159 Mcoords
# become 774 431: **19.6 MB, downloaded WHOLE** (tools/build_overview.loft).
#
# Why whole and not paged: a country-wide viewport names 454 867 cell keys, and §6i measured a key at ~3
# pages (~200 kB) whether or not it holds anything. The whole file is cheaper than six keys. Paging is
# right for a city and wrong for a country, which is the same measurement read from both ends.
#
# ⚠ IT HAS NO ROADS STORE, AND THAT IS THE POINT. It is a picture, never a routing input — a route must
# never be matched against decimated geometry. `chooseBlocks` skips it for `roads` automatically (it has
# no store of that kind), so routing at any zoom still reads the detailed region blocks.
#
# ⚠ THE ZOOM BAND IS LOAD-BEARING, not a nicety. Without it a country-wide box selects the overview AND
# the four regions: the app would ask 454 867 keys of each detailed block, and a `whole` block and a
# `paged` one cannot share one working set anyway. `zoom_max`/`zoom_min` make the two sets EXCLUSIVE —
# below the handover the map is the overview alone, above it the regions alone.
#
# ⚠ `build_zmax` / `build_min_tier` are what DERIVES it, and they are not the same numbers as the zoom
# band above. `zoom_max` is where the app hands over to the next block; `build_zmax` is the zoom whose
# own `minZoom` rules decide which features survive and how far the geometry is decimated. They differ by
# design (10 vs 12 here), so neither can be computed from the other — and a derived block that is not
# rebuilt with its regions describes the previous snapshot while the routes underneath describe the new
# one, with nothing to report it. `tools/build-derived.sh` reads these.
[[region]]
# ⚠ THE ID IS `overview`, NOT `nl-overview`, AND IT IS DELIBERATELY NOT NAMED AFTER A COUNTRY.
#
# This block spans the WHOLE COVERAGE and always will, so a country in its name is wrong at every rung
# after the first. It carries no `derive_from` for the same reason: it must read every source region.
#
# Why it cannot be one overview per country, which is the obvious alternative and is what the middle
# zooms do: it is read `whole`, and `client/web_basemap_kernel.loft` forces PAGED the moment a covering
# set names more than one base URL (a whole-file load ADOPTS an image, so the second would replace the
# first). This block declares no `tier_floor`, so being paged means asking a country-wide box at floor 0
# — §6i measured that at 454 867 keys. And the resident floor below is a single store by construction.
# One block, whole coverage, or the border viewport degrades to something far worse than a big download.
id        = "overview"
name      = "Benelux — overview"
base      = "stores/overview.base.store"
names     = "stores/nl.names.store"
read_mode = "whole"
# ⚠ THE RESIDENT FLOOR (PLAN-LAYERS §5 L3), and it is declared here rather than named in the app.
# `store-app.mjs` hard-coded `nl-overview` until 2026-08-03, so renaming the overview — which the next
# rung does, because it stops being the Netherlands — would have silently lost the floor: the app finds
# no block, sets `floorState = 'absent'`, and stops filling ground the fine layer has not got. Nothing
# reports that; the map just goes blank where it used to be coarse.
#
# Exactly ONE block may carry it. The floor is a single whole-file read by construction (`ensureFloor`
# binds one store and one extent), which is also why the overview must span the whole coverage instead
# of being one block per country: two `whole` blocks in a covering set make the kernel page them
# (client/web_basemap_kernel.loft), and this one declares no tier floor to make that affordable.
floor     = true
zoom_max  = 12
build_zmax = 10
build_min_tier = 2

# PLAN-SCALE §6i O3b — THE MIDDLE ZOOMS. The overview is z<=10 content and the detailed regions cost
# ~1.4 GB of keys at z12, so z12–z13 had neither: instant but coarse. This block is the country at z<=12
# — towns, secondary roads, every medium area — binned with a TIER FLOOR of 1 and read PAGED.
#
# Measured, one viewport, all from the same 213 MB block:
#
#   z12   228 keys   37.5 MB          z13    82 keys   19.2 MB
#
# which is the same class as the detailed path at z16 (18.4 MB). A z<=13 variant was built and rejected:
# 541 MB for 82.2 MB at z12, twice the cost for one more level of content.
#
# ⚠ `tier_floor` is what makes it affordable and it is not cosmetic. Every key below the floor is
# provably absent, and an absent key still costs pages: the same z13 viewport asks 2469 keys and fetches
# 169.6 MB without it, against 82 keys and 43.7 MB with it.
[[region]]
id        = "nl-mid"
name      = "Netherlands — middle zooms (z12–13)"
# ⚠ SCOPED, and it stopped being optional the moment a second country became a derivation source. With
# no `derive_from` a derived block reads EVERY region with roads, so adding Belgium silently widened this
# block to Belgium too — measured, the first time the staged regions were added. That is wrong twice: it
# would put Belgian ground in a block the index says is the Netherlands, and it would make every Belgian
# refresh rebuild this 305 MB block for nothing.
#
# The middle zooms are per-country BECAUSE THEY ARE PAGED: `store_load_keys` accumulates across a
# covering set, so a viewport on the border reads both blocks and fetches only the cells it needs. The
# OVERVIEW is the opposite and deliberately carries no `derive_from` — see its `floor = true` note.
derive_from = "netherlands"
base      = "stores/nl-mid.base.store"
names     = "stores/nl.names.store"
read_mode = "paged"
tier_floor = 1
zoom_min  = 12
zoom_max  = 14
build_zmax = 12
build_min_tier = 1
# HOSTED ON ITS OWN PAGES DATA REPO, like the region base maps and for the same reason: 213 MB beside the
# app took the site to 816 MB of a 950 MB budget (86%), and the block is a picture the browser reads by
# range rather than something the app's own origin must serve. Verified on publication — a cross-origin
# ranged GET answers 206 with `access-control-allow-origin: *` at the exact size.
base_url_base = "https://jjstwerff.github.io/routing-data-nl-mid"
base_cors     = true

# ⚠ `cut_lon_min` / `cut_lon_max` are the one thing here that is an INPUT rather than a fact about data.
#
# The rest of this manifest deliberately declares no geometry — a block's extent is what its data turned
# out to be, so it is derived by `build_index.sh` opening the block. A CUT is the opposite: it is an
# instruction to the generator, there is nothing to derive it from, and until 2026-08-03 it lived only in
# a person's shell history. `data-refresh.yml` was still cutting the country into the TWO halves that
# preceded F3 and could not run at all. `tools/cut-regions.sh` reads these, so the manifest stays the one
# place a region enters coverage — bounds included.
#
# Absent on a side = unbounded there. The bands must MEET (no gap, no overlap) and the ends must be open;
# cut-regions.sh checks all three before it cuts anything. The 0.10° base margin is NOT here: it is one
# policy shared by every region rather than a fact about any one of them (PLAN-SCALE §6f F3).
[[region]]
id        = "nl-west"
# `cut_from` names the block these regions were CUT FROM, so the completeness half of
# block_overlap_gate can check they still add up to it. It existed only as an argument to
# cut-regions.sh — i.e. only in a shell history, which HANDOFF §2 says is not a pipeline. Nothing
# published reads it: build_index ignores unknown keys, exactly as it already ignores cut_lon_*.
cut_from  = "netherlands"
name      = "Netherlands (west of 4.70°E)"
cut_lon_max = 4.70
zoom_min  = 14
roads     = "stores/nl-west.roads.store"
base      = "stores/nl-west.base.store"
names     = "stores/nl.names.store"
read_mode = "paged"
base_url_base = "https://jjstwerff.github.io/routing-data-nl-west"
base_cors     = true

[[region]]
id        = "nl-midwest"
cut_from  = "netherlands"
name      = "Netherlands (4.70–5.40°E)"
cut_lon_min = 4.70
cut_lon_max = 5.40
zoom_min  = 14
roads     = "stores/nl-midwest.roads.store"
base      = "stores/nl-midwest.base.store"
names     = "stores/nl.names.store"
read_mode = "paged"
base_url_base = "https://jjstwerff.github.io/routing-data-nl-midwest"
base_cors     = true

[[region]]
id        = "nl-mideast"
cut_from  = "netherlands"
name      = "Netherlands (5.40–5.90°E)"
cut_lon_min = 5.40
cut_lon_max = 5.90
zoom_min  = 14
roads     = "stores/nl-mideast.roads.store"
base      = "stores/nl-mideast.base.store"
names     = "stores/nl.names.store"
read_mode = "paged"
base_url_base = "https://jjstwerff.github.io/routing-data-nl-mideast"
base_cors     = true

[[region]]
id        = "nl-east"
cut_from  = "netherlands"
name      = "Netherlands (east of 5.90°E)"
cut_lon_min = 5.90
zoom_min  = 14
roads     = "stores/nl-east.roads.store"
base      = "stores/nl-east.base.store"
names     = "stores/nl.names.store"
read_mode = "paged"
base_url_base = "https://jjstwerff.github.io/routing-data-nl-east"
base_cors     = true

# @51 phase C — BELGIUM AND LUXEMBOURG, STAGED. Built, correct, and deliberately not in any index.
#
# `staged = true` means: these blocks exist and may be DERIVED FROM, but nothing published resolves to
# them. `build_index.sh` drops them from both the site and the release index and says so; the derived
# blocks read them as ordinary sources. That distinction is the whole reason the flag exists.
#
# ⚠ WHY THEY CANNOT SHIP AS ROADS YET. A raw Geofabrik Belgium extract overlaps the four live Netherlands
# regions by 377 cells, PARTIALLY — neither block is a subset (@51 phase A measured it per pair). Roads
# must be a disjoint PARTITION, because a route corridor is unbounded: a sketch over the border would
# read those roads TWICE and `build_graph` would match a DIFFERENT route, not merely a slower one. That is
# `PLAN-SCALE` D12, and `block_overlap_gate` is what enforces it. Phase C trims them; until then, staged.
#
# ⚠ Their BASE maps are a different question and are NOT the blocker — a base map is an overlapping COVER
# because a viewport read is bounded, which is why the four NL regions already carry a 0.10° margin of
# each other. What stops the base shipping is hosting, not correctness: Belgium is 1202.5 MB against a
# ~1 GB Pages site, so it needs cutting in two exactly as the Netherlands did.
#
# ⚠ NO HEIGHTS. The terrain cache covers lat 50.63–54.27; Belgium reaches 49.50 and Luxembourg 49.45, so
# the Ardennes — the one part of Benelux where a gradient cost means anything — has none, and neither
# block has been through `bake-heights.sh`. `h == 0` is UNKNOWN, not sea level (@50 states the negative
# control), so nothing reads wrong; there is simply no elevation there yet.
# The middle zooms for the staged countries. These are DERIVED blocks, so they are publishable even
# while their sources are not: a derived block is a picture, never a routing input, and the overlap that
# stops Belgium's ROADS shipping is a partition problem the base map does not have (D12 — a viewport is
# bounded, so an overlapping cover is correct).
#
# Per country rather than one Benelux block, and that is the opposite choice from the overview above:
# these are read PAGED, `store_load_keys` ACCUMULATES across a covering set, and a viewport on the border
# reads both while fetching only the cells it needs. Merging them would rebuild the Netherlands' 305 MB
# block every time Belgium changed, and buy nothing.
[[region]]
id        = "be-mid"
name      = "Belgium — middle zooms (z12–13)"
derive_from = "belgium"
base      = "stores/be-mid.base.store"
names     = "stores/belgium.names.store"
read_mode = "paged"
tier_floor = 1
zoom_min  = 12
zoom_max  = 14
build_zmax = 12
build_min_tier = 1

[[region]]
id        = "lu-mid"
name      = "Luxembourg — middle zooms (z12–13)"
derive_from = "luxembourg"
base      = "stores/lu-mid.base.store"
names     = "stores/luxembourg.names.store"
read_mode = "paged"
tier_floor = 1
zoom_min  = 12
zoom_max  = 14
build_zmax = 12
build_min_tier = 1

[[region]]
id        = "belgium"
name      = "Belgium (staged — roads overlap NL by 377 cells)"
staged    = true
roads     = "stores/belgium.roads.store"
base      = "stores/belgium.base.store"
names     = "stores/belgium.names.store"
read_mode = "paged"
zoom_min  = 14

[[region]]
id        = "luxembourg"
name      = "Luxembourg (staged)"
staged    = true
roads     = "stores/luxembourg.roads.store"
base      = "stores/luxembourg.base.store"
names     = "stores/luxembourg.names.store"
read_mode = "paged"
zoom_min  = 14
