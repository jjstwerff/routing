# Coverage manifest — PLAN-SCALE §7 R0. THE source of truth for what the app covers.
#
# Everything downstream is a function of this file: `tools/build_index.sh` reads it, opens each block to
# learn its ACTUAL extent (never the intent stated here), and writes the top index the app resolves
# against. A region enters coverage by being added here and nowhere else.
#
# Deliberately NOT here: bounding boxes. A block's extent is a fact about the data — osmium clips, a
# generator drops what it cannot classify — so it is derived, not declared. A declared bbox that outran
# its data would be a hole in the map that the index insisted was covered.
#
# read_mode — how the client reads the block (PLAN-SCALE C1b):
#   whole  download once, keep it (right while a block is a few pages wide)
#   paged  store_load_keys over HTTP Range, only the cells a command touches (right at C2 scale)

# The block that ships WITH the app — small, committed, same-origin, and therefore the only one a browser
# can read today (see the CORS note below). It is what every local gate runs against.
# ⚠ THE CLIP BBOX IS PART OF THE BLOCK, so it is written down here. It was not, and rebuilding the base
# map on 2026-07-31 then had no way to reproduce the block it was replacing: the first box tried produced
# 1734 tiles against 1089, a 2.3x bigger download for every visitor. Recovering it took four builds,
# steering on `store_extent`'s four bounds until all of them matched the shipped store exactly.
#
#   tools/build-blocks.sh enschede europe/netherlands 6.75374,52.16,6.9958,52.33      # ROADS
#   tools/build-base.sh   enschede europe/netherlands 6.82558,52.1707,6.9958,52.3230  # BASE
#
# ⚠ The two boxes DIFFER, and that is not an oversight — they were cut separately when the block was first
# made, and each was recovered by steering on its own `store_extent` until all four bounds matched the
# shipped block exactly. Using one box for both would silently re-cut the other layer.
#
# The box looks arbitrary because it IS: `osmium extract` keeps whole ways, so features overhang it by up
# to ~0.09°, and the box is whatever makes the OVERHANG land on the intended extent. Do not "tidy" it to
# round numbers — that changes the block. Expect tile/feature counts to drift with the OSM snapshot (the
# 2026-07-31 rebuild came out at 1093 tiles / 208536 features against 1089 / 204982 two days earlier);
# the four EXTENT bounds are the thing that must match.
[[region]]
id        = "enschede"
name      = "Enschede / south Overijssel"
roads     = "stores/enschede.roads.store"
base      = "stores/enschede.layout.store"
read_mode = "whole"

# ⚠ ROAD BLOCKS MUST NOT OVERLAP. The Enschede roads block was removed here when the Netherlands block
# landed, because NL covers the same ground: with both listed, a sketch whose padded bbox escapes the small
# block names BOTH, the same roads are read twice and fed to `build_graph` twice. It survived only because
# the graph dedups nodes by coordinate — 7138 ways became 9438 for an identical route. A duplicated way is
# not reliably a slower match, it is a different one, so the fix is in the DATA: one block per area, cut on
# cell boundaries (which is what a per-region generation produces anyway).
#
# The Enschede stores are still in the repo and still drive every native gate; they are simply no longer
# a coverage region now that a real country block exists.

# The Netherlands, as TWO regions cut at 5.40°E (tools/split_base.loft / split_block.loft).
#
# Why two: the base map is 3.2 GB for the country and a GitHub release asset stops at 2 GB, so a country
# cannot ship as one file. Regions are §7 R0's unit anyway and are cut on CELL boundaries, so these halves
# are what a per-region generation would have produced directly — and S8's gate proves a route crossing
# the seam is the route the whole region gives.
#
# `url_base` publishes them from the release rather than beside the app: 1.4 GB of base map is not
# something a site build should copy. ⚠ Release assets serve Range but send NO CORS header (measured
# 2026-07-30), so a BROWSER on another origin cannot read these — they serve downloads, the native server
# and offline use.
#
# ⚠ This does NOT mean the browser needs a third-party CORS host. GitHub Pages serves real byte ranges
# (re-measured against the live site 2026-07-30 — the earlier "Pages answers 200 with the whole file"
# claim was measured against `python3 -m http.server` and is wrong). What stops NL shipping on Pages is
# SIZE: ~1 GB per site, and roads+base is 3.2 GB. Roads alone are 504 MB and would fit. PLAN-SCALE D2.

[[region]]
id        = "nl-west"
name      = "Netherlands (west of 5.40°E)"
roads     = "stores/nl-west.roads.store"
base      = "stores/nl-west.base.store"
read_mode = "paged"
url_base  = "https://github.com/jjstwerff/routing/releases/download/data-v2026-07-30"

[[region]]
id        = "nl-east"
name      = "Netherlands (east of 5.40°E)"
roads     = "stores/nl-east.roads.store"
base      = "stores/nl-east.base.store"
read_mode = "paged"
url_base  = "https://github.com/jjstwerff/routing/releases/download/data-v2026-07-30"
