name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A run can be lost without the branch ever being at fault — on 2026-08-06 an Actions outage
  # (15:22 UTC) meant PR #70 was opened into a queue that never created a run, and with no manual
  # trigger the only way to ask again was to push a commit or reopen the PR. `gh workflow run ci.yml
  # --ref <branch>` re-asks directly.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # loft builds with the mold linker; the test harnesses use `fuser` (psmisc)
      # to free the server port, node (global WebSocket) for the WS clients, and
      # wasmtime for the wasm parity gate.
      - name: System deps (mold, psmisc)
        run: |
          sudo apt-get update
          sudo apt-get install -y mold psmisc

      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2, wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No public loft binary release yet — build it from source (its default/
      # lib resolves relative to the binary). Cache keyed on loft's HEAD so repeat
      # runs reuse the compiled toolchain.
      - name: Resolve loft revision
        id: loft
        run: echo "sha=$(git ls-remote https://github.com/loft-lang/loft HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Clone loft
        run: git clone --depth=1 https://github.com/loft-lang/loft /tmp/loft

      - name: Cache cargo + loft build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/loft/target
          key: loft-${{ runner.os }}-${{ steps.loft.outputs.sha }}
          restore-keys: |
            loft-${{ runner.os }}-

      - name: Build loft toolchain
        run: |
          cd /tmp/loft
          cargo build --release --bin loft
          # loft --native-wasm links libloft.rlib built for wasip2 (no default features:
          # mmap/threading aren't wasm-safe) — needed by the wasm client + `make test-wasm`.
          cargo build --release --target wasm32-wasip2 --lib --no-default-features --features random
          echo "LOFT=/tmp/loft/target/release/loft" >> "$GITHUB_ENV"
          echo "LOFT_ROOT=/tmp/loft" >> "$GITHUB_ENV"   # harnesses' --path (default/ + wasip2 rlib)

      # --- build binaries ---
      - name: Build native server binary
        run: make build

      - name: Build wasm client
        run: $LOFT --native-wasm client/kernel.wasm --path /tmp/loft/ --lib lib client/kernel.loft

      # --- gates ---
      # Per gate, not one line for all eight. `make test` stops at the first failure, which is right
      # locally and wrong here: a red build naming gate 1 and hiding gates 2-8 costs a full toolchain
      # build (~5 min) per hidden failure. ci_gates.sh runs them all, folds each one's output into its
      # own log group, annotates the failures, and writes a pass/fail/duration table to the run summary.
      # It reads the SAME tools/gates.offline manifest `make test` does, so the two cannot drift.
      - name: Offline test gates (kernel + server harnesses)
        run: ./tools/ci_gates.sh

      # Non-blocking: the wasm CLIENT build above already proves --native-wasm compiles.
      # This RUNS the wasm under wasmtime for interpret-parity, but loft #518's stack-overflow
      # guard spawns a "main-stack" thread wasip2 can't create, so every --native-wasm program
      # aborts at runtime (wasmtime 43 AND 46 — not a version issue). Tracked: loft-lang/loft#521.
      # Re-make this blocking once #521 lands (gate the thread-spawn to non-wasm targets).
      - name: WASM parity gate (interpret == native-wasm) — informational (loft#521)
        continue-on-error: true
        run: make test-wasm

      # --- artifacts ---
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: routing-binaries-${{ github.sha }}
          path: |
            dist/routing-server-bin
            client/kernel.wasm
          if-no-files-found: error

  # --- GitHub Pages: build the static canvas base-map app (node only — no loft, no network) ---------
  # `node browser/build-site.mjs` bakes the tile pyramid from the committed layer text (browser/*.txt) and
  # inlines the renderer into _site/index.html (+ _site/tiles/). Verified on every push/PR; published from
  # main. (PLAN-MAP: the presentation app has no wasm/loft dependency; routes return via PLAN-EDIT.)
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # PLAN-SCALE N3 — the NL road blocks (497 MB) ship BESIDE the app, because they fit the ~1 GB Pages
      # cap while the 2.87 GB base map does not. They cannot be committed: nl-east.roads.store is
      # 263.9 MB and GitHub hard-rejects any file over 100 MB. So the publishing build fetches them, and
      # verifies each against the sha256 the index already records — a truncated block would leave the
      # index naming a file the site cannot serve, and every match in that region would return no route
      # from a 404 that nothing surfaces.
      #
      # Only on the publishing run: a PR neither uploads an artifact nor needs half a gigabyte, and the
      # size check below is computed from the index rather than from `du`, so it is exact either way.
      - name: Fetch the blocks the index names
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./tools/fetch-site-blocks.sh
      - name: Build the site (bake tiles + inline → _site)
        run: node browser/build-site.mjs
      # MEASURED, not assumed — N3's own words. A Pages deploy over the cap is rejected after the push,
      # so the budget has to fail here instead.
      - name: Check the deployed site fits the Pages budget
        run: ./tools/site_size_gate.sh
      # Publish the artifact only from main; PRs just prove the build above succeeds.
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write        # deploy-pages needs these; build-test/pages keep contents:read only
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy       # never cancel a live deploy mid-flight (separate from ci-${ref})
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
