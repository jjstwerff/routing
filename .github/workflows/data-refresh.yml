name: data-refresh

# Regenerate the routing tile blocks from fresh OpenStreetMap extracts and republish
# them, so the hosted data tracks OSM automatically (PLAN-APP §11).
#
# DORMANT until the generation pipeline is scripted as `tools/build-blocks.sh`
# (currently in scratch — Track C/2). The job SKIPS cleanly when that script is
# absent, so the monthly cron does not fail before the pipeline lands. Enable by
# committing tools/build-blocks.sh (and, if desired, a REGIONS list).

# ⚠ THE MONTHLY CRON IS OFF, DELIBERATELY — do not restore it without fixing the publish step below.
#
# This workflow described itself as dormant "until tools/build-blocks.sh exists", and its gate is
# literally `[ -x tools/build-blocks.sh ]`. That script landed on 2026-07-30, so the dormancy quietly
# ended and the next fire would have been 2026-08-01 04:17 UTC — nobody decided that; a precondition
# came true underneath a comment that still said DORMANT.
#
# It was not ready to run:
#   * it uploads `dist/blocks/*`, and build-blocks.sh writes to `blocks/` — the glob never matches, so
#     both the create and its `||` fallback fail;
#   * the tag is `data-$(date -u +%Y%m)` → `data-202608`, while data/coverage.toml and
#     publish-release.sh use `data-v2026-07-30`. tools/index_fresh_gate.sh's tag check matches `data-v…`
#     and would silently skip a tag in the other shape;
#   * it never rebuilds the coverage index and never runs publish-release.sh, so it would publish blocks
#     no index points at, without that script's 206/CORS asset verification;
#   * it builds loft from loft-lang/loft MAIN, and the fixes this repo depends on are routinely
#     fixed-pending-merge — present in the installed binary, not yet in main.
#
# FIXED 2026-08-01 — the job below now runs `tools/refresh-region.sh` and `tools/publish-release.sh`
# instead of its own inline commands, so it publishes from `blocks/`, tags in the `data-v<date>` shape
# every other tool reads, rebuilds the index, and gets publish-release's per-asset 206 verification.
#
# ⚠ THE CRON STAYS OFF, and now for MEASURED reasons rather than an unfinished pipeline:
#
#   * THE BASE MAP DOES NOT FIT A RUNNER. Measured on the Netherlands: ~28 min, ~6 GB RSS and ~11.7 GB
#     of intermediates (1.8 GB areas + 4.1 GB buildings + 1.0 GB streets geojsonseq, then a 2.0 GB
#     store). A GitHub-hosted runner has ~14 GB of disk before a checkout and a Rust toolchain. So this
#     job runs `--no-base`: roads and names only, ~6 min and ~3 GB, which fits comfortably.
#   * PUBLISHING REPLACES DATA SOMEONE MAY BE READING. `fetch-site-blocks.sh` verifies every download
#     against the sha256 in the committed index, so a republish that nobody expected turns every Pages
#     deploy red until the index is regenerated and committed. That is a decision, not a schedule.
#   * LOFT IS A MOVING TARGET. This builds loft from loft-lang/loft MAIN, and the fixes this repo
#     depends on are routinely fixed-pending-merge — present in the installed binary, absent from main.
#     A monthly cron would discover that at 04:17 on the first, alone.
#
# `workflow_dispatch` is therefore the only trigger: the pipeline is one click, and choosing to run it
# is a person's job.
on:
  # schedule:
  #   - cron: "17 4 1 * *"   # 04:17 UTC on the 1st of each month — see the note above before restoring
  workflow_dispatch:
    inputs:
      region:
        description: "Region id in data/coverage.toml (default: netherlands)"
        required: false
        default: "netherlands"
      source:
        description: "Geofabrik path, e.g. europe/netherlands"
        required: false
        default: "europe/netherlands"
      split_lon:
        description: "Longitude to cut the country into <id>-west / <id>-east"
        required: false
        default: "5.40"
      tag_date:
        description: "Dataset version, e.g. v2026-09-01 (default: today, UTC)"
        required: false
        default: ""

permissions:
  contents: write   # publish the regenerated blocks as a Release

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (osmium, mold, loft)
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool mold
          git clone --depth=1 https://github.com/loft-lang/loft /tmp/loft
          (cd /tmp/loft && cargo build --release --bin loft)
          echo "LOFT_BIN=/tmp/loft/target/release/loft" >> "$GITHUB_ENV"

      - name: Disk before
        run: df -h / | tail -1

      # ROADS + NAMES ONLY. See the note at the top: the base map needs ~11.7 GB of intermediates and
      # does not fit here. `--split 5.40` cuts the country into the halves data/coverage.toml names, and
      # refresh-region.sh asserts the split conserves every way before anything is published.
      - name: Refresh ${{ github.event.inputs.region || 'netherlands' }}
        env:
          DATASET_VERSION: ${{ github.event.inputs.tag_date }}
        run: |
          ver="${DATASET_VERSION:-v$(date -u +%Y-%m-%d)}"
          DATASET_VERSION="$ver" ./tools/refresh-region.sh \
            "${{ github.event.inputs.region || 'netherlands' }}" \
            "${{ github.event.inputs.source || 'europe/netherlands' }}" \
            --no-base --split "${{ github.event.inputs.split_lon || '5.40' }}"
          echo "DATASET_VERSION=$ver" >> "$GITHUB_ENV"

      - name: Disk after
        run: df -h / | tail -1

      # publish-release.sh uploads only what data/coverage.toml names, verifies every asset answers a
      # Range request at the size we uploaded, and publishes the index LAST — so a half-uploaded release
      # is never something a client can resolve into.
      #
      # ⚠ It will publish only the stores present in blocks/. With --no-base that is roads + names; the
      # base map keeps whatever the previous release carried, which is correct — it is a separate store
      # with its own extent, and a road with no landcover around it renders fine.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/publish-release.sh "data-$DATASET_VERSION"

      # The index's sha256s changed, so the committed copy is now stale — and index_fresh_gate will say
      # so on the next run. Opened as a PR rather than pushed: main is protected, and a data refresh that
      # rewrites a committed file deserves the same review as any other change to it.
      - name: Open a PR for the regenerated index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          br="data-refresh-$DATASET_VERSION"
          git checkout -b "$br"
          git add browser/coverage.json data/coverage.toml
          git diff --cached --quiet && { echo "::notice::index unchanged — nothing to open"; exit 0; }
          git commit -m "data($GITHUB_WORKFLOW): refresh to $DATASET_VERSION"
          git push -u origin "$br"
          # One line, deliberately: a multi-line body inside a YAML block scalar has to be indented
          # to stay inside it, and those leading spaces reach GitHub as a markdown code block.
          gh pr create --title "Data refresh $DATASET_VERSION" --body "Automated OSM refresh. Blocks published as \`data-$DATASET_VERSION\`; this updates the index that names them. The BASE MAP was NOT refreshed — it needs ~11.7 GB of intermediates and ~6 GB RSS, which does not fit a GitHub-hosted runner (see the workflow header); rebuild it locally with \`tools/refresh-region.sh netherlands europe/netherlands --split 5.40\`."
